name: Playwright Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: "Playwright Tests"
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        run: npx playwright test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 30

      - name: Create test summary
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            try {
              if (fs.existsSync('playwright-report/results.json')) {
                const results = JSON.parse(fs.readFileSync('playwright-report/results.json', 'utf8'));
                const summary = {
                  total: results.stats.total,
                  passed: results.stats.expected,
                  failed: results.stats.unexpected,
                  flaky: results.stats.flaky,
                  skipped: results.stats.skipped,
                  duration: results.stats.duration
                };
                fs.writeFileSync(process.env.GITHUB_STEP_SUMMARY, `
                ## Playwright Test Summary
                - Total: ${summary.total}
                - Passed: ${summary.passed}
                - Failed: ${summary.failed}
                - Flaky: ${summary.flaky}
                - Skipped: ${summary.skipped}
                - Duration: ${(summary.duration / 1000).toFixed(2)}s
                
                [View detailed report](${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID})
                `);
              } else {
                fs.writeFileSync(process.env.GITHUB_STEP_SUMMARY, '## Playwright Test Summary\nNo test results found.');
              }
            } catch (error) {
              console.error('Error creating test summary:', error);
              fs.writeFileSync(process.env.GITHUB_STEP_SUMMARY, '## Playwright Test Summary\nError creating test summary.');
            }
